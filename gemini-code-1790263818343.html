<!DOCTYPE html>
<html lang="vi-VN" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Ôn Tập Tiếng Việt Lớp 1 (Bài 1 - 15)</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Thư viện ResponsiveVoice -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>

    <!-- Thư viện Bắn Pháo Hoa (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Font chữ Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; color: #1e293b; user-select: none; }
        .kid-card { background: white; border-radius: 1.5rem; border: 4px solid #bbf7d0; box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.2); }
        .btn-3d { transition: all 0.1s; border-bottom-width: 4px; }
        .btn-3d:active { transform: translateY(3px); border-bottom-width: 0px; }
        .pulse-ring { animation: pulseRing 1.5s infinite; }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="p-2 sm:p-6 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ADMIN_PASSWORD_DEFAULT = "2002";
        const STORAGE_KEY_DATA = "tv1_review_app_data_v4";
        const STORAGE_KEY_PASS = "tv1_review_admin_pass_v4";
        const STORAGE_KEY_HISTORY = "tv1_review_history_v4";

        const cleanStr = (str) => str ? str.toLowerCase().replace(/[.,!?]/g, "").trim() : "";

        // Dữ liệu gốc Tiếng Việt Bài 1 đến Bài 15
        const allWords = [
            "ba", "bà", "bá", "ca", "cá", "cà", "bé", "bè", "bê", "bế", "cô", "cố", "cò", "bố", "bò", "bổ", "bộ", "da", "dạ", "dế", "đa", "đá", "đỏ", "đò", "đố", "cờ", "bơ", "đỡ", "cỡ", "dỡ", "cỗ", "đỗ", "bờ", "bi", "bí", "kè", "kê", "kí", "kể", "đi", "dì", "hè", "hề", "lễ", "lè", "hồ", "lá", "lò", "hà", "cụ", "dù", "đủ", "dữ", "cũ", "lũ", "củ", "bự", "chú", "khá", "chị", "chữ", "khó", "chè", "khỉ", "khô",
            "bà ba", "ba bà", "ca ba", "ba ba", "be bé", "bề bề", "bế bé", "bè bè", "ba bé", "bà bè", "bè cá", "bó cỏ", "cổ cò", "bò bê", "ca đá", "đa đa", "da dẻ", "da cá", "bờ cỏ", "cờ đỏ", "cá cờ", "ô đỏ", "đo đỏ", "đỗ đỏ", "dỗ bé", "đi đò", "đá kì", "bi bộ", "ê ke", "kì cọ", "đi bộ", "kì đà", "kề cà", "lọ hồ", "lá cọ", "lễ độ", "kì lạ", "hồ cá", "ba lô", "bó hẹ", "lề hè", "đu đủ", "cá dữ", "cũ kĩ", "bé bự", "cù kì", "cự li", "bà cụ", "ô dù", "chữ kí", "cá kho", "chả cá", "khe đá", "lá khô", "chè kho", "khe khẽ", "chú khỉ", "kè đá", "bó kê", "chà là", "chú hề", "bò kho", "chở đò", "ô li"
        ];

        const allSentences = [
            "A, ba ba!", "Cá be bé.", "Bà bế bé.", "Bè be bé.", "Bé bê ca.", "Cô có cá, có cả cà.", 
            "Bà bế bé, cô Ba bó cỏ.", "Cô có ca đá.", "Bố đố bé.", "Bé có cờ đỏ.", "Bò, bê ở bờ đê.", 
            "Ở bờ đê có dế.", "Bé có bộ đồ đỏ, ô đỏ.", "Bé đi bộ ở bờ đê.", "Bố kê bể cá ở kệ.", 
            "Bé có ba lô.", "Bà có lá hẹ.", "Bé bị ho, bà bế bé.", "Bố bổ đu đủ.", "Ô bà đã cũ.", 
            "Bé đi khe khẽ.", "Kỳ đà bò ở khe đá.", "Hà kẻ ô li.", "Dì Lê đi chợ.", "Bà có chè kho.", 
            "Bố chở bé đi Bờ Hồ."
        ];

        const rawPart1Database = allWords.map(w => ({ word: w, spell: w }));
        const rawPart2Database = [...allSentences];
        // Phần 3 bao gồm toàn bộ dữ liệu của Phần 1 (từ đơn/ghép) và Phần 2 (câu)
        const rawPart3Database = [...allWords, ...allSentences];

        // Tạo số lượng câu động từ danh sách
        const generateQuestionsList = (baseList, targetCount) => {
            let result = [...baseList];
            // Xáo trộn mảng để các câu hỏi đa dạng hơn khi reset
            result.sort(() => Math.random() - 0.5);
            while (result.length < targetCount) {
                result = result.concat(baseList);
            }
            return result.slice(0, targetCount);
        };

        const initialRawData = {
            p1Count: 15, p2Count: 15, p3Count: 20,
            part1: generateQuestionsList(rawPart1Database, 15),
            part2: generateQuestionsList(rawPart2Database, 15),
            part3: generateQuestionsList(rawPart3Database, 20) // Tăng số lượng câu phần 3 mặc định lên 20 vì dữ liệu nhiều
        };

        // Đọc tiếng Việt có tuỳ chỉnh tốc độ
        const speakText = async (text, rate = 0.85) => {
            if (!text) return;
            if (window.responsiveVoice && window.responsiveVoice.isPlaying()) window.responsiveVoice.cancel();
            if (window.currentAudio) { window.currentAudio.pause(); window.currentAudio = null; }

            if (window.responsiveVoice) {
                window.responsiveVoice.speak(text, "Vietnamese Female", { rate: rate });
                return;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN'; utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            }
        };

        // Pháo hoa Phần 3
        const triggerFireworks = () => {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 150, angle: 60, spread: 80, origin: { x: 0, y: 0.8 }, zIndex: 100 });
                confetti({ particleCount: 150, angle: 120, spread: 80, origin: { x: 1, y: 0.8 }, zIndex: 100 });
            }
        };

        // Pháo hoa Mốc 10 Điểm
        const triggerMegaFireworks = () => {
            if (typeof confetti === 'function') {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { 
                        particleCount, origin: { x: Math.random() * (0.9 - 0.1) + 0.1, y: Math.random() - 0.2 } 
                    }));
                }, 250);
            }
        };

        const App = () => {
            const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem(STORAGE_KEY_PASS) || ADMIN_PASSWORD_DEFAULT);

            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_DATA);
                if (saved) { try { return JSON.parse(saved); } catch (e) {} }
                return initialRawData;
            });

            const [completedHistory, setCompletedHistory] = useState(() => {
                const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
                if (savedHistory) { try { return JSON.parse(savedHistory); } catch (e) {} }
                return { p1: [], p2: [], p3: [] };
            });

            const [activeTab, setActiveTab] = useState('p1');
            const [indices, setIndices] = useState({ p1: 0, p2: 0, p3: 0 });
            const [scores, setScores] = useState({ p1: 0, p2: 0, p3: 0 });
            const [isCompleted, setIsCompleted] = useState({ p1: false, p2: false, p3: false });
            const [showMilestone, setShowMilestone] = useState(false);

            const [isListening, setIsListening] = useState(false);
            const [spokenText, setSpokenText] = useState("");
            const [feedbackState, setFeedbackState] = useState({ status: null, msg: '' });
            const [p3Input, setP3Input] = useState("");
            const [reviewModal, setReviewModal] = useState({ open: false, part: null });

            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [passInput, setPassInput] = useState('');
            const [loginError, setLoginError] = useState('');

            const recognitionRef = useRef(null);

            useEffect(() => { localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(data)); }, [data]);
            useEffect(() => { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(completedHistory)); }, [completedHistory]);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const rec = new SpeechRecognition();
                    rec.lang = 'vi-VN'; rec.interimResults = false; rec.maxAlternatives = 1;

                    rec.onstart = () => { setIsListening(true); setSpokenText(""); setFeedbackState({ status: null, msg: '' }); };
                    rec.onend = () => setIsListening(false);
                    rec.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setSpokenText(transcript);
                        checkSpeechResult(transcript);
                    };
                    rec.onerror = () => setIsListening(false);
                    recognitionRef.current = rec;
                }
            }, [activeTab, indices, data]);

            const toggleListening = () => {
                if (!recognitionRef.current) return alert("Trình duyệt không hỗ trợ. Dùng Google Chrome!");
                isListening ? recognitionRef.current.stop() : recognitionRef.current.start();
            };

            const checkSpeechResult = (transcript) => {
                const userSaid = cleanStr(transcript);

                if (activeTab === 'p1') {
                    const currentObj = data.part1[indices.p1];
                    const targetWord = cleanStr(currentObj?.word);
                    const targetSpell = cleanStr(currentObj?.spell);

                    if (userSaid.includes(targetWord) || userSaid === targetSpell) {
                        setScores(prev => {
                            const newScore = prev.p1 + 1;
                            if (newScore > 0 && newScore % 10 === 0) { triggerMegaFireworks(); setShowMilestone(true); }
                            return { ...prev, p1: newScore };
                        });
                        setCompletedHistory(prev => {
                            if (!prev.p1.includes(targetWord)) return { ...prev, p1: [...prev.p1, targetWord] };
                            return prev;
                        });
                        setFeedbackState({ status: 'correct', msg: '✔️ Bé đọc rất chính xác! (+1 điểm)' });
                    } else {
                        setFeedbackState({ status: 'wrong', msg: `❌ Chưa chính xác. AI nghe được: "${transcript}"` });
                    }
                } else if (activeTab === 'p2') {
                    const targetSentenceOrigin = data.part2[indices.p2];
                    const targetSentence = cleanStr(targetSentenceOrigin);

                    if (userSaid === targetSentence || userSaid.length >= targetSentence.length * 0.7) {
                        setScores(prev => {
                            const newScore = prev.p2 + 1;
                            if (newScore > 0 && newScore % 10 === 0) { triggerMegaFireworks(); setShowMilestone(true); }
                            return { ...prev, p2: newScore };
                        });
                        setCompletedHistory(prev => {
                            if (!prev.p2.includes(targetSentenceOrigin)) return { ...prev, p2: [...prev.p2, targetSentenceOrigin] };
                            return prev;
                        });
                        setFeedbackState({ status: 'correct', msg: '✔️ Bé đọc rất tuyệt vời! (+1 điểm)' });
                    } else {
                        setFeedbackState({ status: 'wrong', msg: `❌ Chưa đúng. AI nghe được: "${transcript}"` });
                    }
                }
            };

            useEffect(() => {
                if (activeTab === 'p3' && !isCompleted.p3 && data.part3[indices.p3]) {
                    speakText(data.part3[indices.p3], 0.6);
                    setFeedbackState({ status: null, msg: '' });
                    setP3Input('');
                }
            }, [indices.p3, activeTab, isCompleted.p3]);

            const checkP3Answer = (e) => {
                if (e) e.preventDefault();
                if (feedbackState.status === 'correct') return;

                const targetOrigin = data.part3[indices.p3];
                const target = cleanStr(targetOrigin);
                const studentAnswer = cleanStr(p3Input);

                if (target === studentAnswer) {
                    triggerFireworks();
                    setScores(prev => {
                        const newScore = prev.p3 + 1;
                        if (newScore > 0 && newScore % 10 === 0) { triggerMegaFireworks(); setShowMilestone(true); }
                        return { ...prev, p3: newScore };
                    });
                    setCompletedHistory(prev => {
                        if (!prev.p3.includes(targetOrigin)) return { ...prev, p3: [...prev.p3, targetOrigin] };
                        return prev;
                    });
                    setFeedbackState({ status: 'correct', msg: '🎉 Bé giỏi lắm! Bé trả lời đúng rồi! (+1 điểm)' });
                } else {
                    setFeedbackState({ status: 'wrong', msg: '❌ Chưa đúng rồi, bé hãy kiểm tra lại chữ vừa gõ nhé!' });
                }
            };

            const nextQuestion = (tab) => {
                setFeedbackState({ status: null, msg: '' }); setSpokenText(''); setP3Input('');
                if (tab === 'p1') { indices.p1 < data.part1.length - 1 ? setIndices(prev => ({ ...prev, p1: prev.p1 + 1 })) : setIsCompleted(prev => ({ ...prev, p1: true })); }
                else if (tab === 'p2') { indices.p2 < data.part2.length - 1 ? setIndices(prev => ({ ...prev, p2: prev.p2 + 1 })) : setIsCompleted(prev => ({ ...prev, p2: true })); }
                else if (tab === 'p3') { indices.p3 < data.part3.length - 1 ? setIndices(prev => ({ ...prev, p3: prev.p3 + 1 })) : setIsCompleted(prev => ({ ...prev, p3: true })); }
            };

            const rollDiceNewQuestion = (tab) => {
                setFeedbackState({ status: null, msg: '' }); setSpokenText(''); setP3Input('');
                if (tab === 'p1') {
                    const rnd = Math.floor(Math.random() * rawPart1Database.length);
                    const updated = [...data.part1]; updated[indices.p1] = rawPart1Database[rnd]; setData(prev => ({ ...prev, part1: updated }));
                } else if (tab === 'p2') {
                    const rnd = Math.floor(Math.random() * rawPart2Database.length);
                    const updated = [...data.part2]; updated[indices.p2] = rawPart2Database[rnd]; setData(prev => ({ ...prev, part2: updated }));
                } else if (tab === 'p3') {
                    const rnd = Math.floor(Math.random() * rawPart3Database.length);
                    const updated = [...data.part3]; updated[indices.p3] = rawPart3Database[rnd]; setData(prev => ({ ...prev, part3: updated }));
                    speakText(rawPart3Database[rnd], 0.6);
                }
            };

            const restartTab = (tabName) => {
                setIsCompleted(prev => ({ ...prev, [tabName]: false }));
                setIndices(prev => ({ ...prev, [tabName]: 0 }));
                setScores(prev => ({ ...prev, [tabName]: 0 }));
                setFeedbackState({ status: null, msg: '' });
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                    if (e.code === 'Space') { e.preventDefault(); if (feedbackState.status === 'correct') nextQuestion(activeTab); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [feedbackState, activeTab, indices]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passInput === adminPassword) { setIsAdminAuth(true); setLoginError(''); setPassInput(''); } 
                else { setLoginError('Mật khẩu không đúng!'); }
            };

            const handleUpdateCounts = (p1, p2, p3) => {
                const n1 = Math.max(10, Math.min(200, p1)); const n2 = Math.max(10, Math.min(200, p2)); const n3 = Math.max(10, Math.min(300, p3));
                setData({
                    p1Count: n1, p2Count: n2, p3Count: n3,
                    part1: generateQuestionsList(rawPart1Database, n1), part2: generateQuestionsList(rawPart2Database, n2), part3: generateQuestionsList(rawPart3Database, n3)
                });
                setIndices({ p1: 0, p2: 0, p3: 0 }); setScores({ p1: 0, p2: 0, p3: 0 }); setIsCompleted({ p1: false, p2: false, p3: false });
            };

            const handleResetDefault = () => {
                if (window.confirm("Khôi phục mặc định và xoá lịch sử học tập?")) {
                    setData(initialRawData); setAdminPassword(ADMIN_PASSWORD_DEFAULT); setCompletedHistory({ p1: [], p2: [], p3: [] });
                    localStorage.removeItem(STORAGE_KEY_DATA); localStorage.removeItem(STORAGE_KEY_PASS); localStorage.removeItem(STORAGE_KEY_HISTORY);
                    alert("Đã khôi phục thành công!");
                }
            };

            return (
                <div className="max-w-7xl mx-auto relative">
                    <header className="kid-card p-4 mb-6 flex flex-wrap items-center justify-between gap-3 bg-white">
                        <h1 className="text-xl sm:text-2xl font-black text-emerald-600 flex items-center gap-2">
                            <span>📖</span> Ôn Tập Tiếng Việt
                        </h1>
                        <nav className="flex flex-wrap gap-2">
                            <button onClick={() => setActiveTab('p1')} className={`px-3 py-2 rounded-xl font-bold text-sm btn-3d ${activeTab === 'p1' ? 'bg-sky-500 text-white border-sky-700' : 'bg-sky-100 text-sky-600 border-sky-300'}`}>🔊 1. Đánh Vần</button>
                            <button onClick={() => setActiveTab('p2')} className={`px-3 py-2 rounded-xl font-bold text-sm btn-3d ${activeTab === 'p2' ? 'bg-emerald-500 text-white border-emerald-700' : 'bg-emerald-100 text-emerald-600 border-emerald-300'}`}>📖 2. Đọc Câu</button>
                            <button onClick={() => setActiveTab('p3')} className={`px-3 py-2 rounded-xl font-bold text-sm btn-3d ${activeTab === 'p3' ? 'bg-purple-500 text-white border-purple-700' : 'bg-purple-100 text-purple-600 border-purple-300'}`}>✍️ 3. Nghe & Gõ</button>
                            <button onClick={() => setActiveTab('admin')} className={`px-3 py-2 rounded-xl font-bold text-sm btn-3d ${activeTab === 'admin' ? 'bg-slate-700 text-white border-slate-900' : 'bg-slate-200 text-slate-700 border-slate-400'}`}>🔒 Giáo Viên</button>
                        </nav>
                    </header>

                    <div className="flex flex-col lg:flex-row gap-6 items-start">
                        
                        <aside className="w-full lg:w-1/4 kid-card p-5 bg-amber-50 border-amber-200 sticky top-6">
                            <h3 className="text-lg font-black text-amber-800 border-b-2 border-amber-200 pb-2 mb-4 flex items-center gap-2">
                                <span>⭐</span> Từ Bé Đã Học
                            </h3>
                            <div className="space-y-5 max-h-[70vh] overflow-y-auto pr-2">
                                <div>
                                    <h4 className="text-sm font-black text-sky-600 uppercase mb-2">P1. Đánh Vần ({completedHistory.p1.length})</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {completedHistory.p1.map((w, i) => <span key={i} className="px-2 py-1 bg-sky-200 text-sky-800 rounded-lg text-xs font-bold border border-sky-300 shadow-sm">{w}</span>)}
                                    </div>
                                </div>
                                <div>
                                    <h4 className="text-sm font-black text-emerald-600 uppercase mb-2">P2. Đọc Câu ({completedHistory.p2.length})</h4>
                                    <div className="flex flex-col gap-2">
                                        {completedHistory.p2.map((w, i) => <span key={i} className="px-2 py-1 bg-emerald-200 text-emerald-800 rounded-lg text-xs font-bold border border-emerald-300 shadow-sm">{w}</span>)}
                                    </div>
                                </div>
                                <div>
                                    <h4 className="text-sm font-black text-purple-600 uppercase mb-2">P3. Nghe & Gõ ({completedHistory.p3.length})</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {completedHistory.p3.map((w, i) => <span key={i} className="px-2 py-1 bg-purple-200 text-purple-800 rounded-lg text-xs font-bold border border-purple-300 shadow-sm">{w}</span>)}
                                    </div>
                                </div>
                            </div>
                        </aside>

                        <main className="w-full lg:w-3/4 space-y-6">

                            {activeTab === 'p1' && !isCompleted.p1 && data.part1 && (
                                <div className="kid-card p-6 text-center w-full">
                                    <div className="flex justify-between items-center text-sm font-bold text-slate-400 mb-4">
                                        <span>Câu {indices.p1 + 1} / {data.part1.length}</span>
                                        <div className="flex gap-2">
                                            <button onClick={() => rollDiceNewQuestion('p1')} className="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg border border-amber-300 font-bold text-xs">🎲 Đổi câu mới</button>
                                            <button onClick={() => setReviewModal({ open: true, part: 'p1' })} className="bg-sky-100 hover:bg-sky-200 text-sky-800 px-3 py-1.5 rounded-lg border border-sky-300 font-bold text-xs">📚 Ôn tập toàn bộ</button>
                                        </div>
                                        <span className="text-emerald-600 font-extrabold">Điểm: {scores.p1}</span>
                                    </div>

                                    <p className="text-xl font-black text-slate-700 mb-2">Bé hãy đọc to từ dưới đây:</p>
                                    <div className="text-6xl font-black text-sky-600 my-4 py-8 bg-sky-50 rounded-2xl border-2 border-sky-200 shadow-inner">{data.part1[indices.p1]?.word}</div>
                                    <button onClick={() => speakText(data.part1[indices.p1]?.spell)} className="mb-6 bg-sky-500 hover:bg-sky-400 text-white font-bold py-2 px-5 rounded-full btn-3d border-sky-700 inline-flex items-center gap-2 text-base">🔊 AI đọc mẫu</button>

                                    <div>
                                        <button onClick={toggleListening} className={`w-20 h-20 rounded-full text-3xl text-white font-bold mx-auto flex items-center justify-center transition-all ${isListening ? 'bg-red-500 pulse-ring' : 'bg-pink-500 hover:bg-pink-400 btn-3d border-pink-700'}`}>
                                            {isListening ? '🎙️' : '🎤'}
                                        </button>
                                        <p className="mt-2 text-sm font-bold text-slate-500">{isListening ? "AI đang nghe bé đọc..." : "Bấm Micro để đọc"}</p>
                                    </div>

                                    {feedbackState.status === 'correct' && (
                                        <div className="mt-6 p-4 rounded-2xl bg-green-50 border-2 border-green-200">
                                            <p className="text-green-600 font-black text-xl mb-3">{feedbackState.msg}</p>
                                            <button onClick={() => nextQuestion('p1')} className="bg-green-500 text-white font-bold py-3 px-8 rounded-full btn-3d border-green-700 text-lg">➡️ Câu tiếp theo (Nhấn Phím Space)</button>
                                        </div>
                                    )}
                                    {feedbackState.status === 'wrong' && <div className="mt-6 p-3 rounded-xl bg-red-50 border-2 border-red-200 text-red-500 font-bold">{feedbackState.msg}</div>}
                                </div>
                            )}

                            {activeTab === 'p2' && !isCompleted.p2 && data.part2 && (
                                <div className="kid-card p-6 text-center w-full">
                                    <div className="flex justify-between items-center text-sm font-bold text-slate-400 mb-4">
                                        <span>Câu {indices.p2 + 1} / {data.part2.length}</span>
                                        <div className="flex gap-2">
                                            <button onClick={() => rollDiceNewQuestion('p2')} className="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg border border-amber-300 font-bold text-xs">🎲 Đổi câu mới</button>
                                            <button onClick={() => setReviewModal({ open: true, part: 'p2' })} className="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-3 py-1.5 rounded-lg border border-emerald-300 font-bold text-xs">📚 Ôn tập toàn bộ</button>
                                        </div>
                                        <span className="text-emerald-600 font-extrabold">Điểm: {scores.p2}</span>
                                    </div>

                                    <p className="text-xl font-black text-slate-700 mb-2">Bé hãy đọc to câu dưới đây:</p>
                                    <div className="text-4xl font-black text-emerald-700 my-6 py-8 px-4 bg-emerald-50 rounded-2xl border-2 border-emerald-200 shadow-inner leading-relaxed">{data.part2[indices.p2]}</div>
                                    <button onClick={() => speakText(data.part2[indices.p2])} className="mb-6 bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-2 px-5 rounded-full btn-3d border-emerald-700 inline-flex items-center gap-2 text-base">🔊 AI đọc mẫu</button>

                                    <div>
                                        <button onClick={toggleListening} className={`w-20 h-20 rounded-full text-3xl text-white font-bold mx-auto flex items-center justify-center transition-all ${isListening ? 'bg-red-500 pulse-ring' : 'bg-emerald-600 hover:bg-emerald-500 btn-3d border-emerald-800'}`}>
                                            {isListening ? '🎙️' : '🎤'}
                                        </button>
                                        <p className="mt-2 text-sm font-bold text-slate-500">{isListening ? "AI đang nghe bé đọc..." : "Bấm Micro để đọc"}</p>
                                    </div>

                                    {feedbackState.status === 'correct' && (
                                        <div className="mt-6 p-4 rounded-2xl bg-green-50 border-2 border-green-200">
                                            <p className="text-green-600 font-black text-xl mb-3">{feedbackState.msg}</p>
                                            <button onClick={() => nextQuestion('p2')} className="bg-green-500 text-white font-bold py-3 px-8 rounded-full btn-3d border-green-700 text-lg">➡️ Câu tiếp theo (Nhấn Phím Space)</button>
                                        </div>
                                    )}
                                    {feedbackState.status === 'wrong' && <div className="mt-6 p-3 rounded-xl bg-red-50 border-2 border-red-200 text-red-500 font-bold">{feedbackState.msg}</div>}
                                </div>
                            )}

                            {activeTab === 'p3' && !isCompleted.p3 && data.part3 && (
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                                    <div className="lg:col-span-8 kid-card p-6 text-center shadow-lg">
                                        <div className="flex justify-between items-center text-sm font-bold text-slate-400 mb-4">
                                            <span>Câu {indices.p3 + 1} / {data.part3.length}</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => rollDiceNewQuestion('p3')} className="bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg border border-amber-300 font-bold text-xs">🎲 Đổi câu mới</button>
                                                <button onClick={() => setReviewModal({ open: true, part: 'p3' })} className="bg-purple-100 hover:bg-purple-200 text-purple-800 px-3 py-1.5 rounded-lg border border-purple-300 font-bold text-xs">📚 Ôn tập toàn bộ</button>
                                            </div>
                                            <span className="text-emerald-600 font-extrabold">Điểm: {scores.p3}</span>
                                        </div>

                                        <p className="text-2xl font-black text-slate-700 mb-4">Lắng nghe và gõ lại:</p>
                                        <button onClick={() => speakText(data.part3[indices.p3], 0.6)} className="mb-8 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-8 rounded-full btn-3d border-purple-800 inline-flex items-center gap-3 text-xl pulse-ring">🔊 Nghe AI đọc lại </button>

                                        <form onSubmit={checkP3Answer} className="space-y-6 w-full max-w-lg mx-auto">
                                            <input type="text" value={p3Input} onChange={(e) => setP3Input(e.target.value)} placeholder="Gõ câu trả lời..." className="w-full p-6 border-4 border-purple-300 rounded-2xl font-black text-center text-3xl sm:text-4xl text-slate-800 focus:border-purple-600 outline-none shadow-inner" autoFocus />
                                            <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-2xl btn-3d border-purple-800 text-xl">✔️ Kiểm Tra</button>
                                        </form>

                                        {feedbackState.status === 'correct' && (
                                            <div className="mt-8 p-5 rounded-2xl bg-green-50 border-2 border-green-200">
                                                <p className="text-green-600 font-black text-2xl mb-4">{feedbackState.msg}</p>
                                                <button onClick={() => nextQuestion('p3')} className="bg-green-500 text-white font-bold py-4 px-10 rounded-full btn-3d border-green-700 text-xl">➡️ Tiếp theo (Space)</button>
                                            </div>
                                        )}
                                        {feedbackState.status === 'wrong' && <div className="mt-6 p-4 rounded-xl bg-red-50 border-2 border-red-200 text-red-500 font-bold text-lg">{feedbackState.msg}</div>}
                                    </div>

                                    <div className="lg:col-span-4 kid-card p-4 bg-purple-50 border-purple-200">
                                        <h3 className="text-base font-black text-purple-800 border-b border-purple-200 pb-2 mb-3 flex items-center gap-2"><span>⌨️</span> Hướng Dẫn Gõ Telex</h3>
                                        <div className="space-y-1.5 text-xs font-bold text-slate-700">
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Dấu Sắc (s)</span><span className="text-purple-600">a + s = á</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Dấu Huyền (f)</span><span className="text-purple-600">a + f = à</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Dấu Hỏi (r)</span><span className="text-purple-600">a + r = ả</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Dấu Ngã (x)</span><span className="text-purple-600">a + x = ã</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Dấu Nặng (j)</span><span className="text-purple-600">a + j = ạ</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Â/Ê/Ô</span><span className="text-purple-600">aa, ee, oo</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Ă/Ơ/Ư</span><span className="text-purple-600">aw, ow, uw</span></div>
                                            <div className="p-1.5 bg-white rounded-lg border flex justify-between"><span>Chữ Đ</span><span className="text-purple-600">dd = đ</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {['p1', 'p2', 'p3'].map(tab => (
                                activeTab === tab && isCompleted[tab] && (
                                    <div key={tab} className="kid-card p-8 text-center bg-white w-full shadow-lg">
                                        <div className="text-6xl mb-4">🏆</div>
                                        <h2 className="text-3xl font-black text-slate-800 mb-2">Hoàn Thành!</h2>
                                        <p className="text-xl font-bold text-emerald-600 mb-6">Bé đạt {scores[tab]} / {data[`${tab}Count`]} điểm</p>
                                        <button onClick={() => restartTab(tab)} className="bg-sky-500 text-white font-bold py-3 px-8 rounded-full btn-3d border-sky-700 text-lg">🔄 Làm lại từ đầu</button>
                                    </div>
                                )
                            ))}

                            {activeTab === 'admin' && (
                                <div className="kid-card p-6 bg-white w-full max-w-xl mx-auto">
                                    {!isAdminAuth ? (
                                        <div className="text-center py-6 space-y-4">
                                            <div className="text-5xl">🔒</div>
                                            <h2 className="text-2xl font-black text-slate-800">Khu Vực Giáo Viên</h2>
                                            <form onSubmit={handleAdminLogin} className="space-y-4 max-w-xs mx-auto pt-2">
                                                <input type="password" value={passInput} onChange={(e) => setPassInput(e.target.value)} placeholder="Nhập mật khẩu..." className="w-full p-3 border-2 border-slate-300 rounded-xl font-bold text-center focus:border-slate-600 outline-none" autoFocus />
                                                {loginError && <p className="text-red-500 text-sm font-bold">{loginError}</p>}
                                                <button type="submit" className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl btn-3d border-slate-950">🔓 Xác nhận</button>
                                            </form>
                                        </div>
                                    ) : (
                                        <div className="space-y-6">
                                            <div className="flex justify-between items-center border-b pb-3">
                                                <h2 className="text-2xl font-black text-slate-800">⚙️ Cấu Hình</h2>
                                                <div className="flex gap-2">
                                                    <button onClick={handleResetDefault} className="text-xs bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold px-3 py-1.5 rounded-lg border border-amber-300">🔄 Khôi phục</button>
                                                    <button onClick={() => setIsAdminAuth(false)} className="text-xs bg-red-100 hover:bg-red-200 text-red-600 font-bold px-3 py-1.5 rounded-lg border border-red-300">🔒 Khóa lại</button>
                                                </div>
                                            </div>
                                            <div className="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200 space-y-4">
                                                <h3 className="font-black text-emerald-800">📊 Số lượng câu hỏi (10-300):</h3>
                                                <div className="flex justify-between"><span className="font-bold text-sm">Phần 1:</span><input type="number" min="10" max="300" value={data.p1Count} onChange={(e) => handleUpdateCounts(Number(e.target.value), data.p2Count, data.p3Count)} className="w-24 p-1 border-2 rounded text-center" /></div>
                                                <div className="flex justify-between"><span className="font-bold text-sm">Phần 2:</span><input type="number" min="10" max="300" value={data.p2Count} onChange={(e) => handleUpdateCounts(data.p1Count, Number(e.target.value), data.p3Count)} className="w-24 p-1 border-2 rounded text-center" /></div>
                                                <div className="flex justify-between"><span className="font-bold text-sm">Phần 3:</span><input type="number" min="10" max="300" value={data.p3Count} onChange={(e) => handleUpdateCounts(data.p1Count, data.p2Count, Number(e.target.value))} className="w-24 p-1 border-2 rounded text-center" /></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>

                    {showMilestone && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 text-center animate-bounce shadow-2xl border-4 border-yellow-400">
                                <div className="text-8xl mb-4">🌟</div>
                                <h2 className="text-4xl font-black text-red-500 mb-4">CHÚC MỪNG BÉ!</h2>
                                <p className="text-2xl font-bold text-emerald-600">Bé đã xuất sắc hoàn thành thêm 10 câu!</p>
                                <button onClick={() => setShowMilestone(false)} className="mt-6 bg-yellow-500 hover:bg-yellow-400 text-white font-black py-3 px-8 rounded-full btn-3d text-xl border-yellow-700">Tiếp tục nào!</button>
                            </div>
                        </div>
                    )}

                    {reviewModal.open && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[85vh] p-6 overflow-y-auto shadow-2xl border-4 border-emerald-300">
                                <div className="flex justify-between items-center border-b pb-3 mb-4 sticky top-0 bg-white z-10">
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2">
                                        <span>📚</span> Bảng Ôn Tập Toàn Bộ Kiến Thức 
                                        <span className="text-sm font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded-lg">
                                            (Tổng cộng: {reviewModal.part === 'p1' ? rawPart1Database.length : reviewModal.part === 'p2' ? rawPart2Database.length : rawPart3Database.length} câu)
                                        </span>
                                    </h3>
                                    <button onClick={() => setReviewModal({ open: false, part: null })} className="text-gray-500 hover:text-red-500 font-black text-3xl leading-none">✖</button>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                    {reviewModal.part === 'p1' && rawPart1Database.map((item, idx) => {
                                        const isCompleted = completedHistory.p1.includes(cleanStr(item.word));
                                        return (
                                            <div key={idx} className={`p-3 rounded-xl border-2 flex flex-col justify-center items-center text-center gap-2 ${isCompleted ? 'bg-green-50 border-green-300' : 'bg-sky-50 border-sky-200'}`}>
                                                <p className={`font-black text-lg ${isCompleted ? 'text-green-700' : 'text-sky-800'}`}>
                                                    {item.word} {isCompleted && <span className="text-sm">✅</span>}
                                                </p>
                                                <button onClick={() => speakText(item.spell)} className={`w-full ${isCompleted ? 'bg-green-500' : 'bg-sky-500'} text-white text-xs px-2 py-1.5 rounded-lg font-bold`}>🔊 Nghe</button>
                                            </div>
                                        )
                                    })}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {reviewModal.part === 'p2' && rawPart2Database.map((item, idx) => {
                                        const isCompleted = completedHistory.p2.includes(item);
                                        return (
                                            <div key={idx} className={`p-3 rounded-xl border-2 flex justify-between items-center ${isCompleted ? 'bg-green-50 border-green-300' : 'bg-emerald-50 border-emerald-200'}`}>
                                                <p className={`font-black text-base flex items-center gap-2 ${isCompleted ? 'text-green-700' : 'text-emerald-800'}`}>
                                                    {item} {isCompleted && <span className="text-sm">✅</span>}
                                                </p>
                                                <button onClick={() => speakText(item)} className={`${isCompleted ? 'bg-green-500' : 'bg-emerald-500'} text-white text-xs px-3 py-1.5 rounded-lg font-bold shrink-0 ml-2`}>🔊 Nghe</button>
                                            </div>
                                        )
                                    })}

                                    {reviewModal.part === 'p3' && rawPart3Database.map((item, idx) => {
                                        const isCompleted = completedHistory.p3.includes(item);
                                        return (
                                            <div key={idx} className={`p-3 rounded-xl border-2 flex justify-between items-center ${isCompleted ? 'bg-green-50 border-green-300' : 'bg-purple-50 border-purple-200'}`}>
                                                <p className={`font-black text-base flex items-center gap-2 ${isCompleted ? 'text-green-700' : 'text-purple-800'}`}>
                                                    {item} {isCompleted && <span className="text-sm">✅</span>}
                                                </p>
                                                <button onClick={() => speakText(item, 0.6)} className={`${isCompleted ? 'bg-green-500' : 'bg-purple-500'} text-white text-xs px-3 py-1.5 rounded-lg font-bold shrink-0 ml-2`}>🔊 Nghe</button>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
